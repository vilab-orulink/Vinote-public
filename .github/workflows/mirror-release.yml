name: Mirror VINote release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Copy verified installer into draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          filename=release-20261106-public-migration-VINote_0.3.9_x64-setup.exe
          curl --fail --location --retry 3 -o "$filename" "https://github.com/orulink-ai/VINote/releases/download/v0.3.9/$filename"
          echo "cd9a7413c317d54e49af4ff8d7c96249cfea9dccb812af71527cf2df38aa352f  $filename" | sha256sum -c -
          gh release upload v0.3.9 "$filename" --repo vilab-orulink/Vinote-public --clobber
