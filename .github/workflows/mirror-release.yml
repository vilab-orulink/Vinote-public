name: Mirror VINote release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Copy verified installer into draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          filename=release-20261106-task-center-VINote_0.3.10_x64-setup.exe
          curl --fail --location --retry 3 -o "$filename" "https://github.com/orulink-ai/VINote/releases/download/v0.3.10/$filename"
          echo "485ff631e4209ad76fb69953461641ae69fb03d9ca518863c71671cec2c21b4e  $filename" | sha256sum -c -
          gh release upload v0.3.10 "$filename" --repo vilab-orulink/Vinote-public
